name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ollieos_ref:
        description: OllieOS branch, tag or commit to build
        default: main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install icon tooling
        run: python3 -m pip install --break-system-packages pillow

      - name: Build
        env:
          OLLIEOS_REF: ${{ github.event.inputs.ollieos_ref || 'main' }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: OllieOS-ipa
          path: build/*.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.ipa
